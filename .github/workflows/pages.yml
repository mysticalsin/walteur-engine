name: pages

# Publishes the design-proof-app field-run as a real, third-party-openable artifact.
# WHY THIS EXISTS: the harness-100 rubric caps the `oneshot` dimension (weight 15) until one field run
# is verifiably public. Every prior run was localhost-only, so the ledger's Live-URL cells all read
# "NOT public, no external URL" and the dimension could not exceed ~4/10 regardless of build quality.
# Free tier only: GitHub Pages on a public repo. No paid service, no domain, no new account.
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
